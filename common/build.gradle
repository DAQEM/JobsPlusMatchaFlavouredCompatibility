plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file("gradle/scripts/maven-publishing.gradle")

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    implementation "com.daqem.knot:knot-common:${project.knot_version}"
    implementation "com.daqem.uilib:uilib-common:${project.uilib_version}"
    implementation "com.daqem.yamlconfig:yamlconfig-common:${project.yamlconfig_version}"
    implementation "com.daqem.arc:arc-common:${project.arc_version}"
    implementation "com.daqem.itemrestrictions:itemrestrictions-common:${project.itemrestrictions_version}"
    implementation "com.daqem.jobsplus:jobsplus-common:${project.jobsplus_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

tasks.register('printVersionName') {
    doLast {
        println version
    }
}